name: pantheon
description: "¡Crea una aplicación móvil vibrante e intuitiva con estas pantallas y funcionalidades para dar vida a tus ideas con estilo!"
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  go_router: ^17.0.0
  provider: ^6.0.0
  shared_preferences: ^2.0.0
  intl: 0.20.2
  dio: ^5.9.0
  flutter_secure_storage: ^10.0.0
  supabase_flutter: ^2.8.1
  google_mobile_ads: ^7.0.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
